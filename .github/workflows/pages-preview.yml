# Reusable per-PR preview deploy to Cloudflare Pages, with one sticky PR comment carrying the URL.
#
# The caller builds the static site and uploads it with actions/upload-artifact, then:
#
#   jobs:
#     preview:
#       needs: build
#       permissions:
#         pull-requests: write     # the sticky comment
#       uses: LykosAI/.github/.github/workflows/pages-preview.yml@main
#       with:
#         artifact-name: storybook
#         project-name: my-pages-project
#         account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
#         comment-heading: Storybook preview
#       secrets:
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#
# Runs on pull_request events only. Each PR deploys to the Pages branch `pr-<number>`, so its
# URL is stable across pushes: https://pr-<number>.<project>.pages.dev.
#
# The Pages project must already exist: a non-interactive `wrangler pages deploy` refuses a
# missing project rather than creating it. Create it once with
# `npx wrangler pages project create <project> --production-branch=main`.
#
# With no token or no account id, and on a PR from a fork (which is given neither), the deploy is
# skipped with a notice and the job succeeds, so a repo can adopt this before its credentials exist.
#
# Preview URLs are public unless the Pages project's preview deployments are behind Cloudflare
# Access (project Settings, "Enable access policy").
name: Pages Preview

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the artifact (uploaded earlier in the calling run) holding the static site
        required: true
        type: string
      project-name:
        description: Cloudflare Pages project to deploy into
        required: true
        type: string
      account-id:
        description: Cloudflare account id that owns the project (an org variable, not a secret)
        required: false
        type: string
        default: ""
      comment-heading:
        description: First line of the sticky PR comment; also tells two previews on one PR apart
        required: false
        type: string
        default: Preview
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: API token with Cloudflare Pages Edit on the account
        required: false
    outputs:
      url:
        description: The PR's preview URL, empty when the deploy was skipped
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - name: Check what this run may deploy
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_ID: ${{ inputs.account-id }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          skip() { echo "::notice title=Preview not deployed::$1"; echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = "pull_request" ] || skip "Previews deploy for pull_request events only (this is $EVENT)."
          [ "$HEAD_REPO" = "$REPO" ] || skip "PR from a fork ($HEAD_REPO): no credentials are passed to it."
          [ "$HAS_TOKEN" = "true" ] || skip "CLOUDFLARE_API_TOKEN is not set for this repository."
          [ -n "$ACCOUNT_ID" ] || skip "No Cloudflare account id was passed (vars.CLOUDFLARE_ACCOUNT_ID is not set)."
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Download the site
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: site

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ inputs.account-id }}
          wranglerVersion: 4.146.0
          command: pages deploy site --project-name=${{ inputs.project-name }} --branch=pr-${{ github.event.pull_request.number }} --commit-hash=${{ github.event.pull_request.head.sha }}

      - name: Pick the URL
        id: url
        if: steps.gate.outputs.deploy == 'true'
        env:
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment-url }}
        # The alias is the PR's stable address; the deployment URL is this push's own.
        run: echo "url=${ALIAS:-$DEPLOYMENT}" >> "$GITHUB_OUTPUT"

      - name: Post or update the sticky comment
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/github-script@v9
        env:
          HEADING: ${{ inputs.comment-heading }}
          PROJECT: ${{ inputs.project-name }}
          URL: ${{ steps.url.outputs.url }}
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { HEADING, PROJECT, URL, DEPLOYMENT, SHA } = process.env;
            const marker = `<!-- pages-preview:${PROJECT}:${HEADING} -->`;
            const body = [
              marker,
              `**${HEADING}:** ${URL}`,
              '',
              `Built from ${SHA.slice(0, 7)}. This push alone: ${DEPLOYMENT}`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
